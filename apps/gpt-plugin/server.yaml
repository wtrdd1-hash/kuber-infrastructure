apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-plugin-server
  namespace: gpt-plugin
  labels:
    app.kubernetes.io/name: gpt-plugin-server
    app.kubernetes.io/part-of: minipc-mcp
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gpt-plugin
  template:
    metadata:
      labels:
        app: gpt-plugin
        app.kubernetes.io/name: gpt-plugin-server
        app.kubernetes.io/part-of: minipc-mcp
    spec:
      hostPID: true
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: materialize-source
          image: python:3.13-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /app/core /app/services
              cp /source/main.py /app/main.py
              cp /source/root-init.py /app/__init__.py
              cp /source/core-config.py /app/core/config.py
              cp /source/services-init.py /app/services/__init__.py
              cp /source/services-cloudflare_dns.py /app/services/cloudflare_dns.py
              cp /source/services-ddns.py /app/services/ddns.py
              cp /source/services-executor.py /app/services/executor.py
              cp /source/services-k8s.py /app/services/k8s.py
              cp /source/services-monitor.py /app/services/monitor.py
          volumeMounts:
            - name: source-config
              mountPath: /source
            - name: project-dir
              mountPath: /app
      containers:
        - name: api
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["ALL"]
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              set -e
              pip install --no-cache-dir --retries 5 --timeout 30 fastapi==0.141.1 uvicorn==0.52.4 psutil==7.2.2 pydantic==2.13.5 mcp==1.30.0 sse-starlette==3.4.11 httpx==0.28.1
              exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
          env:
            - name: DDNS_ENABLED
              value: "true"
            - name: DDNS_INTERVAL_SECONDS
              value: "60"
            - name: DDNS_DOMAINS
              value: "ssh.easy-scraping.com,mini.easy-scraping.com,direct.easy-scraping.com,nas.easy-scraping.com"
            - name: DDNS_UPDATE_SPF
              value: "true"
            - name: MCP_SECRET_ENV_FILE
              value: "/run/secrets/cloudflare.env"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 3
          volumeMounts:
            - name: project-dir
              mountPath: /workspace/app
            - name: data-dir
              mountPath: /workspace/data
            - name: cloudflare-env
              mountPath: /run/secrets/cloudflare.env
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: false
      volumes:
        - name: source-config
          configMap:
            name: gpt-plugin-source
        - name: cloudflare-env
          hostPath:
            path: /var/lib/gpt-plugin/cloudflare.env
            type: File
        - name: project-dir
          emptyDir: {}
        - name: data-dir
          hostPath:
            path: /var/lib/gpt-plugin/data
            type: DirectoryOrCreate
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: gpt-plugin-backend
  namespace: gpt-plugin
spec:
  selector:
    app: gpt-plugin
  ports:
    - name: http
      port: 8000
      targetPort: http
