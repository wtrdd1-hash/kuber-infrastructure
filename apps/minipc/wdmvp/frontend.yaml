---
apiVersion: v1
kind: Service
metadata:
  name: wdmvp-frontend
  namespace: wdmvp
spec:
  selector:
    app.kubernetes.io/name: wdmvp-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmvp-frontend
  namespace: wdmvp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmvp-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmvp-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/wtrdd1-hash/wdmv/frontend:0014863950d130c430005cfba7dd0f28a3cfd062-production
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            # The browser never reaches the backend directly for most paths --
            # Next.js calls it server-side over the cluster network.
            - name: API_ORIGIN
              value: http://wdmvp-backend:3000
          envFrom:
            - secretRef:
                name: wdmvp-app
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            # The image runs read-only; Next.js still needs somewhere to write
            # its cache and a scratch directory.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/frontend/.next/cache
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
