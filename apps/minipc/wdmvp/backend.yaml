---
apiVersion: v1
kind: Service
metadata:
  name: wdmvp-backend
  namespace: wdmvp
spec:
  selector:
    app.kubernetes.io/name: wdmvp-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmvp-backend
  namespace: wdmvp
spec:
  replicas: 1
  # The photo volume is ReadWriteOnce on one node's disk, so two pods cannot
  # both hold it. Recreate rather than RollingUpdate, which would wait for a
  # new pod that can never start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmvp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmvp-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          # Not pullable: this is a private package of another account. It is
          # in containerd because it was imported from the machine's backup,
          # which is the only copy that exists here.
          image: ghcr.io/wtrdd1-hash/wdmv/backend:a5e4af99e5b4cfd3b1fd7d4e846e4086dd939aed-production
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: PHOTO_STORAGE_DIR
              value: /data/moneyverse/photos
            # DATABASE_URL is assembled from two secret values rather than
            # stored as a third, so the password exists in one place. $(VAR)
            # is expanded by the kubelet from the vars declared above it.
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmvp-app, key: APP_DB_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: wdmvp-app, key: DB_NAME }
            - name: DATABASE_URL
              value: postgresql://moneyverse_app:$(APP_DB_PASSWORD)@wdmvp-db:5432/$(DB_NAME)
          envFrom:
            # Everything else the compose file passed through: base URL, OAuth
            # clients, encryption keys, Discord. Deliberately not the database
            # superuser's password -- that is in wdmvp-db-superuser, which only the
            # StatefulSet mounts, so a compromised application process reads
            # the account it was given and not the one that can rewrite the
            # schema.
            - secretRef:
                name: wdmvp-app
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: photos
              mountPath: /data/moneyverse/photos
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: wdmvp-photos
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
