apiVersion: v1
kind: Service
metadata:
  name: wdmv-test-backend
  namespace: wdmv-test
spec:
  selector:
    app.kubernetes.io/name: wdmv-test-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmv-test-backend
  namespace: wdmv-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmv-test-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-backend
    spec:
      imagePullSecrets:
        - name: wdmv-test-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/wtrdd1-hash/wdmv/backend:567dbaab0b4a609986c2cf343530ac1b81398c4f-test
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PHOTO_STORAGE_DIR, value: /data/moneyverse/photos }
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: APP_DB_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: DB_NAME }
            - name: DATABASE_URL
              value: postgresql://moneyverse_app:$(APP_DB_PASSWORD)@wdmv-test-db:5432/$(DB_NAME)
            - { name: MARKET_TICKER_ENABLED, value: "false" }
            - { name: WEB_HEALTH_URL, value: http://wdmv-test-frontend:3000/ }
            - { name: ADMIN_TOTP_KEY_ID, value: test }
          envFrom:
            - secretRef:
                name: wdmv-test-app
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: photos, mountPath: /data/moneyverse/photos }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: photos
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
