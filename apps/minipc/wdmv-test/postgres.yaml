apiVersion: v1
kind: Service
metadata:
  name: wdmv-test-db
  namespace: wdmv-test
spec:
  selector:
    app.kubernetes.io/name: wdmv-test-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wdmv-test-db
  namespace: wdmv-test
spec:
  serviceName: wdmv-test-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmv-test-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-db
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: moneyverse_migrator
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-db-superuser, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: moneyverse_test
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Test-only generated credentials are injected here so the checked-out
          # migration/seed scripts can initialize least-privilege roles without
          # placing any credential in Git or command-line arguments.
          envFrom:
            - secretRef:
                name: wdmv-test-app
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U moneyverse_migrator -d moneyverse_test"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U moneyverse_migrator -d moneyverse_test"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
