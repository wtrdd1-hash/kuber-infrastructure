# Five volumes because docker-mailserver keeps five things apart, and the
# important one is mail-data: the mailboxes. Everything else can be rebuilt
# from configuration; a lost mailbox is lost.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mail-data, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mail-state, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mail-config, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mail-certs, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 128Mi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mail-logs, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: webmail-data, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
# The custom Roundcube skin, which was its own bind mount. ROUNDCUBEMAIL_SKIN
# names it, and Roundcube falls back to the default -- silently -- if the
# directory is not there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: webmail-skin, namespace: mail }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 256Mi } }
