---
apiVersion: v1
kind: Service
metadata:
  name: wdmvp-frontend
  namespace: wdmvp
spec:
  selector:
    app.kubernetes.io/name: wdmvp-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmvp-frontend
  namespace: wdmvp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmvp-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmvp-frontend
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets:
        # ghcr.io/wtrdd1-hash/wdmv/* is a private package. Without this the
        # kubelet asks ghcr anonymously, is told 401, and the rollout stops at
        # ImagePullBackOff while the previous pod keeps serving -- which looks
        # like a healthy deployment until you read its Progressing condition.
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/wtrdd1-hash/wdmv/frontend:6c4237ccb811d37485fef2e65d390b936e188ccc-production
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: APP_BASE_URL
              value: https://easy-scraping.com
            # Keep runtime metadata/indexing aligned with the production image.
            # Explicit env entries take precedence over envFrom secrets, so a
            # stale shared secret cannot accidentally mark Production noindex.
            - name: SEO_INDEXING_ENABLED
              value: "true"
            # The browser never reaches the backend directly for most paths --
            # Next.js calls it server-side over the cluster network.
            - name: API_ORIGIN
              value: http://wdmvp-backend:3000
          envFrom:
            - secretRef:
                name: wdmvp-app
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 8
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/frontend/.next/cache
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 256Mi }
