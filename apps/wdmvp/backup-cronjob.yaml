apiVersion: batch/v1
kind: CronJob
metadata:
  name: wdmvp-db-backup
  namespace: wdmvp
  labels:
    app.kubernetes.io/name: wdmvp-db-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/version: "v2026.09.12.1"
spec:
  schedule: "17 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wdmvp-db-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/version: "v2026.09.12.1"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17.11-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wdmvp-db-superuser
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  base="/backup/wdmvp-moneyverse_production-${stamp}"
                  partial="${base}.dump.partial"
                  final="${base}.dump"
                  checksum="${final}.sha256"
                  trap 'rm -f "$partial" "$checksum.partial"' EXIT

                  echo "backup start: ${stamp}"
                  pg_dump -h wdmvp-db -U moneyverse_migrator \
                    -d moneyverse_production --no-owner --no-privileges \
                    -Fc -Z 9 -f "$partial"

                  # Refuse to publish a dump that PostgreSQL cannot parse.
                  pg_restore -l "$partial" >/dev/null
                  mv "$partial" "$final"

                  (
                    cd /backup
                    sha256sum "$(basename "$final")" > "$(basename "$checksum").partial"
                    sha256sum -c "$(basename "$checksum").partial" >/dev/null
                    mv "$(basename "$checksum").partial" "$(basename "$checksum")"
                  )
                  trap - EXIT

                  # Keep 48 hourly restore points. This gives two full days to
                  # notice a bad migration or accidental deletion while keeping
                  # host-path growth bounded. A separate recovery CronJob reads
                  # the newest published dump and proves it can actually restore.
                  cd /backup
                  ls -1 wdmvp-moneyverse_production-*.dump 2>/dev/null \
                    | sort -r | tail -n +49 \
                    | while IFS= read -r old; do rm -f -- "$old" "$old.sha256"; done

                  # An OOM kill or node reboot can bypass the shell EXIT trap.
                  # Clean abandoned partials only after two hours so a live job
                  # can never delete another run's in-progress output.
                  find /backup -maxdepth 1 -type f \
                    \( -name 'wdmvp-moneyverse_production-*.dump.partial' \
                       -o -name 'wdmvp-moneyverse_production-*.dump.sha256.partial' \) \
                    -mmin +120 -delete

                  bytes="$(wc -c < "$final")"
                  echo "backup complete: $(basename "$final") (${bytes} bytes)"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              hostPath:
                path: /home/wtrdd/moneyverse-backups/k8s
                type: DirectoryOrCreate
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
