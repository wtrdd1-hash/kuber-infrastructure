---
apiVersion: v1
kind: Service
metadata:
  name: wdmvp-backend
  namespace: wdmvp
spec:
  selector:
    app.kubernetes.io/name: wdmvp-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmvp-backend
  namespace: wdmvp
spec:
  replicas: 1
  # The photo volume is ReadWriteOnce on one node's disk, so two pods cannot
  # both hold it. Recreate rather than RollingUpdate, which would wait for a
  # new pod that can never start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmvp-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmvp-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        # ghcr.io/wtrdd1-hash/wdmv/* is a private package. Without this the
        # kubelet asks ghcr anonymously, is told 401, and the rollout stops at
        # ImagePullBackOff while the previous pod keeps serving -- which looks
        # like a healthy deployment until you read its Progressing condition.
        - name: ghcr-pull
      containers:
        - name: backend
          # Immutable: the tag is the commit. IfNotPresent below therefore
          # never serves a stale image, and it saves a pull on every restart.
          image: ghcr.io/wtrdd1-hash/wdmv/backend:6c4237ccb811d37485fef2e65d390b936e188ccc-production
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: PHOTO_STORAGE_DIR
              value: /data/moneyverse/photos
            # DATABASE_URL is assembled from two secret values rather than
            # stored as a third, so the password exists in one place. $(VAR)
            # is expanded by the kubelet from the vars declared above it.
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmvp-app, key: APP_DB_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: wdmvp-app, key: DB_NAME }
            - name: DATABASE_URL
              value: postgresql://moneyverse_app:$(APP_DB_PASSWORD)@wdmvp-db:5432/$(DB_NAME)

            # Two more connections the compose file assembled the same way,
            # each as a role with less than the application's own. Without
            # them the backend starts and quietly says "no collector
            # credential configured; not collecting".
            - name: STATUS_COLLECTOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmvp-app, key: STATUS_COLLECTOR_PASSWORD }
            - name: STATUS_COLLECTOR_DATABASE_URL
              value: postgresql://moneyverse_status_collector:$(STATUS_COLLECTOR_PASSWORD)@wdmvp-db:5432/$(DB_NAME)
            - name: RECONCILER_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmvp-app, key: RECONCILER_PASSWORD }
            - name: RECONCILER_DATABASE_URL
              value: postgresql://moneyverse_reconciler:$(RECONCILER_PASSWORD)@wdmvp-db:5432/$(DB_NAME)

            # Defaults that lived in the compose file rather than in .env, so
            # they arrived with the stack and not with the secret. The image's
            # own defaults are not the same: leave MARKET_TICKER_ENABLED out
            # and the backend logs "market ticker disabled; prices will not
            # move on their own", which is a running site with a frozen
            # economy rather than an error anybody would notice.
            - name: MARKET_TICKER_ENABLED
              value: "true"
            - name: MARKET_TICK_INTERVAL_MS
              value: "1000"
            - name: STATUS_COLLECT_INTERVAL_MS
              value: "30000"
            # The backend collector defaults to the retired Compose DNS name
            # `frontend`; Kubernetes uses the Service name below.
            - name: WEB_HEALTH_URL
              value: http://wdmvp-frontend:3000/
            - name: ADMIN_TOTP_KEY_ID
              value: default
          envFrom:
            # Everything else the compose file passed through: base URL, OAuth
            # clients, encryption keys, Discord. Deliberately not the database
            # superuser's password -- that is in wdmvp-db-superuser, which only the
            # StatefulSet mounts, so a compromised application process reads
            # the account it was given and not the one that can rewrite the
            # schema.
            - secretRef:
                name: wdmvp-app
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: photos
              mountPath: /data/moneyverse/photos
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: wdmvp-photos
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
