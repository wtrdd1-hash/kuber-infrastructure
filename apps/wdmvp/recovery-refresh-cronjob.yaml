apiVersion: batch/v1
kind: CronJob
metadata:
  name: wdmvp-recovery-refresh
  namespace: wdmvp
spec:
  schedule: "37 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 1200
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wdmvp-recovery-refresh
            app.kubernetes.io/component: recovery
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: postgres:17.11-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wdmvp-db-superuser
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  src=/tmp/production.dump
                  rm -f "$src"

                  pg_dump -h wdmvp-db -U moneyverse_migrator \
                    -d moneyverse_production --no-owner --no-privileges \
                    -Fc -Z 6 -f "$src"
                  pg_restore -l "$src" >/dev/null

                  psql -h wdmvp-recovery-db -U moneyverse_recovery_admin -d postgres \
                    -v ON_ERROR_STOP=1 <<'SQL'
                  SELECT pg_terminate_backend(pid)
                  FROM pg_stat_activity
                  WHERE datname = 'moneyverse_recovery' AND pid <> pg_backend_pid();
                  DROP DATABASE IF EXISTS moneyverse_recovery;
                  CREATE DATABASE moneyverse_recovery;
                  SQL

                  pg_restore -h wdmvp-recovery-db -U moneyverse_recovery_admin \
                    -d moneyverse_recovery --no-owner --no-privileges \
                    --exit-on-error "$src"

                  psql -h wdmvp-recovery-db -U moneyverse_recovery_admin \
                    -d moneyverse_recovery -v ON_ERROR_STOP=1 \
                    -c 'SELECT 1;' >/dev/null
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 750m, memory: 768Mi }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
