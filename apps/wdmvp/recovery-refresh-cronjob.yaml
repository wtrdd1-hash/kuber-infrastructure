apiVersion: batch/v1
kind: CronJob
metadata:
  name: wdmvp-recovery-refresh
  namespace: wdmvp
  labels:
    app.kubernetes.io/name: wdmvp-recovery-refresh
    app.kubernetes.io/component: recovery
    app.kubernetes.io/version: "v2026.09.12.1"
spec:
  schedule: "37 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 1200
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wdmvp-recovery-refresh
            app.kubernetes.io/component: recovery
            app.kubernetes.io/version: "v2026.09.12.1"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: postgres:17.11-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wdmvp-db-superuser
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  backup_dir=/backup
                  src="$(find "$backup_dir" -maxdepth 1 -type f \
                    -name 'wdmvp-moneyverse_production-*.dump' \
                    | sort | tail -1)"

                  [ -n "$src" ] || {
                    echo "no persisted production backup found in $backup_dir" >&2
                    exit 1
                  }
                  checksum="${src}.sha256"
                  [ -f "$checksum" ] || {
                    echo "missing checksum for $src" >&2
                    exit 1
                  }

                  # Fail closed if automatic backup has silently stopped. The
                  # backup job runs hourly at :17 and this restore proof runs at
                  # :37, so anything older than two hours is stale.
                  if [ -n "$(find "$src" -mmin +120 -print)" ]; then
                    echo "latest backup is older than two hours: $src" >&2
                    exit 1
                  fi

                  echo "verifying persisted backup: $(basename "$src")"
                  (
                    cd "$backup_dir"
                    sha256sum -c "$(basename "$checksum")"
                  )
                  pg_restore -l "$src" >/dev/null

                  psql -h wdmvp-recovery-db -U moneyverse_recovery_admin -d postgres \
                    -v ON_ERROR_STOP=1 <<'SQL'
                  SELECT pg_terminate_backend(pid)
                  FROM pg_stat_activity
                  WHERE datname = 'moneyverse_recovery' AND pid <> pg_backend_pid();
                  DROP DATABASE IF EXISTS moneyverse_recovery;
                  CREATE DATABASE moneyverse_recovery;
                  SQL

                  pg_restore -h wdmvp-recovery-db -U moneyverse_recovery_admin \
                    -d moneyverse_recovery --no-owner --no-privileges \
                    --exit-on-error "$src"

                  # A completed restore must be queryable. Keep this deliberately
                  # generic so schema evolution does not make the backup monitor
                  # itself brittle.
                  psql -h wdmvp-recovery-db -U moneyverse_recovery_admin \
                    -d moneyverse_recovery -v ON_ERROR_STOP=1 \
                    -c 'SELECT 1;' >/dev/null
                  echo "restore verification complete: $(basename "$src")"
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 750m, memory: 768Mi }
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              hostPath:
                path: /home/wtrdd/moneyverse-backups/k8s
                type: Directory
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
