# The storage layer, chosen per cluster. This one runs Rook, which is what
# this repository was written against: four machines with disks to spare.
# A single-node cluster points this at ./infrastructure/storage/local-path
# instead -- see infrastructure/storage/README.md.
#
# Between the controllers and the configs: Rook's CephCluster is a custom
# resource its operator defines, and the configs below expect a StorageClass
# to already exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 30m
  retryInterval: 2m
  # Ceph pulls its images and waits for mons to form a quorum; a short timeout
  # here reports failure on a cluster that is merely still starting.
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/storage/rook
  prune: true
  wait: true
