# The workloads this cluster exists to run. Its own directory rather than the
# shared ./apps, because apps are what differs between clusters -- the platform
# below them is what is shared.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  prune: true
  # wdmvp ships a registry credential as a sops file; without this the
  # ciphertext is applied verbatim and the kubelet gets an unusable secret.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
