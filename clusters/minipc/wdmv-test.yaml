# Moneyverse rehearsal environment is deliberately reconciled independently
# from production apps. A broken test Deployment must never block production
# reconciliation on this single-node cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wdmv-test
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./staging/wdmv-test
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: wdmv-test-db
      namespace: wdmv-test
    - apiVersion: apps/v1
      kind: Deployment
      name: wdmv-test-backend
      namespace: wdmv-test
    - apiVersion: apps/v1
      kind: Deployment
      name: wdmv-test-frontend
      namespace: wdmv-test
