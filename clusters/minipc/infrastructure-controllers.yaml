# The operators and controllers themselves. Split from the configs below
# because the things in configs are custom resources these controllers define,
# so applying both at once fails on a CRD that does not exist yet.
# The manifests live in ./infrastructure at the repo root rather than under
# clusters/<your-cluster>, because the flux-system Kustomization scans everything below
# clusters/<your-cluster> recursively. Anything left there is applied with no ordering
# and no sops decryption -- which is how the encrypted Cloudflare token first
# failed, against a cert-manager namespace that did not exist yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  # Generous: three Helm charts pull their images over a home connection the
  # first time, and a timeout here would fail the whole set.
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers
  prune: true
  # Blocks infrastructure-configs until these are actually Ready, not merely
  # applied -- which is the point of the split.
  wait: true

  # Traefik pins its LoadBalancer address, for the reason its own comment
  # gives: the address ends up in routes and in DNS, so it must not move
  # because the service was recreated. The pinned value is an address in the
  # pool this repository was written against, and this cluster's pool is
  # somewhere else -- an address outside the pool is never assigned, and the
  # service sits <pending> with the label correctly in place, which is a
  # confusing way to fail.
  #
  # .201 rather than .200: /29 makes .200 the network address.
  patches:
    - target:
        kind: HelmRelease
        name: traefik
        namespace: traefik
      patch: |
        - op: replace
          path: /spec/values/service/annotations/lbipam.cilium.io~1ips
          value: "192.168.100.201"
