# What the controllers are told to build.
#
# Decryption is on: the age key is installed. kuber-nixos-flakes' flux-sops-key
# unit reads ~/.config/sops/age/keys.txt on the machine and puts it in the
# cluster as the `sops-age` secret on every boot, so a machine rebuilt from
# that flake can read its own secrets again.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-storage
  interval: 30m
  retryInterval: 2m
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # The pool in ./infrastructure/configs is the address range of the cluster
  # this repository was written for. Patched rather than copied so there is
  # still one CiliumLoadBalancerIPPool in the repository to read.
  #
  # 192.168.100.200/29 is on the inward NIC, above the range dnsmasq hands out
  # (.50-.100) so a leased address and a service address can never be the same
  # one. Nothing on the internet reaches these: what does arrives through the
  # tunnel.
  patches:
    - target:
        kind: CiliumLoadBalancerIPPool
        name: lan-pool
      patch: |
        - op: replace
          path: /spec/blocks/0/cidr
          value: 192.168.100.200/29
