apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cert-manager solves the DNS-01 challenge through Cloudflare's API, which
  # needs a token with Zone:DNS:Edit on the zone. It is not in this repository
  # — create it, seal it, and add it here:
  #
  #     kubectl create secret generic cloudflare-api-token -n cert-manager \
  #       --from-literal=api-token=<token> --dry-run=client -o yaml \
  #       > cloudflare-api-token.sops.yaml
  #     sops --encrypt --in-place cloudflare-api-token.sops.yaml
  #
  # - cloudflare-api-token.sops.yaml
  - cluster-issuer.yaml
  - cloudflared
  - cilium-lb-ippool.yaml
