apiVersion: v1
kind: Service
metadata:
  name: wdmv-test-frontend
  namespace: wdmv-test
spec:
  selector:
    app.kubernetes.io/name: wdmv-test-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmv-test-frontend
  namespace: wdmv-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmv-test-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-frontend
        app.kubernetes.io/environment: test
        moneyverse.openai/candidate-sha: "6c4237ccb811d37485fef2e65d390b936e188ccc"
    spec:
      imagePullSecrets:
        - name: wdmv-test-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/wtrdd1-hash/wdmv/frontend:6c4237ccb811d37485fef2e65d390b936e188ccc-test
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: API_ORIGIN, value: http://wdmv-test-backend:3000 }
          envFrom:
            - secretRef:
                name: wdmv-test-frontend
            - secretRef:
                name: wdmv-test-internal
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 8
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/frontend/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 128Mi }
