apiVersion: v1
kind: ConfigMap
metadata:
  name: wdmv-test-db-init
  namespace: wdmv-test
data:
  010-moneyverse-bootstrap.sh: |
    #!/bin/sh
    set -eu
    : "${TEST_SOURCE_SHA:?TEST_SOURCE_SHA is required}"
    work=/tmp/moneyverse-source
    rm -rf "$work"
    mkdir -p "$work"
    wget -qO /tmp/moneyverse-source.tgz \
      "https://codeload.github.com/wtrdd1-hash/Woldeok-Moneyverse-Migration/tar.gz/${TEST_SOURCE_SHA}"
    tar -xzf /tmp/moneyverse-source.tgz -C "$work" --strip-components=1
    sh "$work/packages/database/init/000-create-app-role.sh"
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=ON_ERROR_STOP=1 -f "$work/packages/database/init/001-economy-core.sql"
    echo "fresh test database core initialized from ${TEST_SOURCE_SHA}"
---
apiVersion: v1
kind: Service
metadata:
  name: wdmv-test-db
  namespace: wdmv-test
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wdmv-test-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wdmv-test-db
  namespace: wdmv-test
spec:
  serviceName: wdmv-test-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmv-test-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-db
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: moneyverse_migrator }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-db-superuser, key: POSTGRES_PASSWORD }
            - { name: POSTGRES_DB, value: moneyverse_test }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TEST_SOURCE_SHA, value: "bd81c92e226138dbb56e3d10e6a123256f516e77" }
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: APP_DB_PASSWORD }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U moneyverse_migrator -d moneyverse_test"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U moneyverse_migrator -d moneyverse_test"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 75m, memory: 192Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/010-moneyverse-bootstrap.sh
              subPath: 010-moneyverse-bootstrap.sh
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: wdmv-test-db-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
