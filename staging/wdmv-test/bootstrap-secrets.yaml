apiVersion: v1
kind: ServiceAccount
metadata:
  name: wdmv-test-secret-bootstrap
  namespace: wdmv-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wdmv-test-secret-bootstrap
  namespace: wdmv-test
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wdmv-test-secret-bootstrap
  namespace: wdmv-test
subjects:
  - kind: ServiceAccount
    name: wdmv-test-secret-bootstrap
    namespace: wdmv-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wdmv-test-secret-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wdmv-test-ghcr-reader
  namespace: wdmvp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wdmv-test-ghcr-reader
  namespace: wdmvp
subjects:
  - kind: ServiceAccount
    name: wdmv-test-secret-bootstrap
    namespace: wdmv-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wdmv-test-ghcr-reader
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wdmv-test-secret-bootstrap-v4
  namespace: wdmv-test
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-secret-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: wdmv-test-secret-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: bootstrap
          image: curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              auth="Authorization: Bearer ${token}"

              get() {
                curl -fsS --cacert "$ca" -H "$auth" "${api}$1"
              }
              exists() {
                curl -fsS --cacert "$ca" -H "$auth" -o /dev/null "${api}$1" 2>/dev/null
              }
              post() {
                curl -fsS --cacert "$ca" -H "$auth" \
                  -H 'Content-Type: application/json' --data-binary "$2" "${api}$1" >/dev/null
              }
              random_hex() {
                od -An -N 32 -tx1 /dev/urandom | tr -d ' \n'
              }

              if ! exists /api/v1/namespaces/wdmv-test/secrets/wdmv-test-app; then
                app_password="$(random_hex)"
                collector_password="$(random_hex)"
                reconciler_password="$(random_hex)"
                totp_key="$(random_hex)"
                data_encryption_key="$(random_hex)"
                post /api/v1/namespaces/wdmv-test/secrets "$(cat <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"wdmv-test-app","namespace":"wdmv-test"},"type":"Opaque","stringData":{"APP_BASE_URL":"https://test.easy-scraping.com","APP_DB_PASSWORD":"${app_password}","DB_NAME":"moneyverse_test","STATUS_COLLECTOR_PASSWORD":"${collector_password}","RECONCILER_PASSWORD":"${reconciler_password}","ADMIN_TOTP_ENCRYPTION_KEY":"${totp_key}","ADMIN_TOTP_KEY_ID":"test","DATA_ENCRYPTION_KEY":"${data_encryption_key}","COOKIE_SECURE":"true","SEO_INDEXING_ENABLED":"false","ADS_ENABLED":"false","DISCORD_INTERACTIONS_ENABLED":"false","DISCORD_OUTBOX_ENABLED":"false"}}
              JSON
              )"
              fi

              if ! exists /api/v1/namespaces/wdmv-test/secrets/wdmv-test-internal; then
                internal_token="$(random_hex)"
                post /api/v1/namespaces/wdmv-test/secrets "$(cat <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"wdmv-test-internal","namespace":"wdmv-test"},"type":"Opaque","stringData":{"INTERNAL_API_TOKEN":"${internal_token}"}}
              JSON
              )"
              fi

              if ! exists /api/v1/namespaces/wdmv-test/secrets/wdmv-test-frontend; then
                post /api/v1/namespaces/wdmv-test/secrets "$(cat <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"wdmv-test-frontend","namespace":"wdmv-test"},"type":"Opaque","stringData":{"APP_BASE_URL":"https://test.easy-scraping.com","SEO_INDEXING_ENABLED":"false","ADS_ENABLED":"false"}}
              JSON
              )"
              fi

              if ! exists /api/v1/namespaces/wdmv-test/secrets/wdmv-test-db-superuser; then
                db_password="$(random_hex)"
                post /api/v1/namespaces/wdmv-test/secrets "$(cat <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"wdmv-test-db-superuser","namespace":"wdmv-test"},"type":"Opaque","stringData":{"POSTGRES_PASSWORD":"${db_password}"}}
              JSON
              )"
              fi

              if ! exists /api/v1/namespaces/wdmv-test/secrets/wdmv-test-registry; then
                production_pull="$(get /api/v1/namespaces/wdmvp/secrets/ghcr-pull)"
                docker_config="$(printf '%s' "$production_pull" | sed -n 's/.*"\.dockerconfigjson"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
                test -n "$docker_config"
                post /api/v1/namespaces/wdmv-test/secrets "$(cat <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"wdmv-test-registry","namespace":"wdmv-test"},"type":"kubernetes.io/dockerconfigjson","data":{".dockerconfigjson":"${docker_config}"}}
              JSON
              )"
              fi

              echo 'test-only secrets are present; production application and database secrets were not copied'
