apiVersion: v1
kind: ServiceAccount
metadata:
  name: wdmv-test-secret-bootstrap
  namespace: wdmv-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wdmv-test-secret-bootstrap
  namespace: wdmv-test
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wdmv-test-secret-bootstrap
  namespace: wdmv-test
subjects:
  - kind: ServiceAccount
    name: wdmv-test-secret-bootstrap
    namespace: wdmv-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wdmv-test-secret-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wdmv-test-ghcr-reader
  namespace: wdmvp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ghcr-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wdmv-test-ghcr-reader
  namespace: wdmvp
subjects:
  - kind: ServiceAccount
    name: wdmv-test-secret-bootstrap
    namespace: wdmv-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wdmv-test-ghcr-reader
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wdmv-test-secret-bootstrap-v6
  namespace: wdmv-test
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-secret-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: wdmv-test-secret-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: bootstrap
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["python", "-c"]
          args:
            - |
              import json
              import os
              import secrets
              import ssl
              import urllib.error
              import urllib.request

              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ["KUBERNETES_SERVICE_PORT_HTTPS"]
              api = f"https://{host}:{port}"
              token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              with open(token_path, "r", encoding="utf-8") as handle:
                  token = handle.read().strip()
              context = ssl.create_default_context(cafile=ca_path)
              headers = {"Authorization": f"Bearer {token}"}

              def request(path, method="GET", payload=None):
                  body = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
                  req_headers = dict(headers)
                  if body is not None:
                      req_headers["Content-Type"] = "application/json"
                  req = urllib.request.Request(api + path, data=body, headers=req_headers, method=method)
                  with urllib.request.urlopen(req, context=context, timeout=15) as response:
                      data = response.read()
                      return json.loads(data) if data else None

              def exists(path):
                  try:
                      request(path)
                      return True
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          return False
                      raise

              def create_secret(name, secret_type, string_data=None, data=None):
                  payload = {
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {"name": name, "namespace": "wdmv-test"},
                      "type": secret_type,
                  }
                  if string_data is not None:
                      payload["stringData"] = string_data
                  if data is not None:
                      payload["data"] = data
                  request("/api/v1/namespaces/wdmv-test/secrets", "POST", payload)

              def replace_secret(name, secret_type, data):
                  path = f"/api/v1/namespaces/wdmv-test/secrets/{name}"
                  current = request(path)
                  payload = {
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {
                          "name": name,
                          "namespace": "wdmv-test",
                          "resourceVersion": current["metadata"]["resourceVersion"],
                      },
                      "type": secret_type,
                      "data": data,
                  }
                  request(path, "PUT", payload)

              def token_hex():
                  return secrets.token_hex(32)

              if not exists("/api/v1/namespaces/wdmv-test/secrets/wdmv-test-app"):
                  create_secret("wdmv-test-app", "Opaque", {
                      "APP_BASE_URL": "https://test.easy-scraping.com",
                      "APP_DB_PASSWORD": token_hex(),
                      "DB_NAME": "moneyverse_test",
                      "STATUS_COLLECTOR_PASSWORD": token_hex(),
                      "RECONCILER_PASSWORD": token_hex(),
                      "ADMIN_TOTP_ENCRYPTION_KEY": token_hex(),
                      "ADMIN_TOTP_KEY_ID": "test",
                      "DATA_ENCRYPTION_KEY": token_hex(),
                      "COOKIE_SECURE": "true",
                      "SEO_INDEXING_ENABLED": "false",
                      "ADS_ENABLED": "false",
                      "DISCORD_INTERACTIONS_ENABLED": "false",
                      "DISCORD_OUTBOX_ENABLED": "false",
                  })

              if not exists("/api/v1/namespaces/wdmv-test/secrets/wdmv-test-internal"):
                  create_secret("wdmv-test-internal", "Opaque", {"INTERNAL_API_TOKEN": token_hex()})

              if not exists("/api/v1/namespaces/wdmv-test/secrets/wdmv-test-frontend"):
                  create_secret("wdmv-test-frontend", "Opaque", {
                      "APP_BASE_URL": "https://test.easy-scraping.com",
                      "SEO_INDEXING_ENABLED": "false",
                      "ADS_ENABLED": "false",
                  })

              if not exists("/api/v1/namespaces/wdmv-test/secrets/wdmv-test-db-superuser"):
                  create_secret("wdmv-test-db-superuser", "Opaque", {"POSTGRES_PASSWORD": token_hex()})

              production_pull = request("/api/v1/namespaces/wdmvp/secrets/ghcr-pull")
              docker_config = production_pull.get("data", {}).get(".dockerconfigjson")
              if not docker_config:
                  raise RuntimeError("production ghcr-pull secret is missing .dockerconfigjson")
              registry_data = {".dockerconfigjson": docker_config}
              registry_path = "/api/v1/namespaces/wdmv-test/secrets/wdmv-test-registry"
              if exists(registry_path):
                  replace_secret("wdmv-test-registry", "kubernetes.io/dockerconfigjson", registry_data)
                  print("test registry secret refreshed from current production pull credentials")
              else:
                  create_secret(
                      "wdmv-test-registry",
                      "kubernetes.io/dockerconfigjson",
                      data=registry_data,
                  )
                  print("test registry secret created from current production pull credentials")

              print("test-only secrets are present; production application and database secrets were not copied")
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
