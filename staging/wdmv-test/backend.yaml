apiVersion: v1
kind: Service
metadata:
  name: wdmv-test-backend
  namespace: wdmv-test
spec:
  selector:
    app.kubernetes.io/name: wdmv-test-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdmv-test-backend
  namespace: wdmv-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wdmv-test-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdmv-test-backend
        app.kubernetes.io/environment: test
        moneyverse.openai/candidate-sha: "cf73d089883f7d98d21b7b25b7d4083d9e37c02f"
    spec:
      imagePullSecrets:
        - name: wdmv-test-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: TEST_SOURCE_SHA, value: "cf73d089883f7d98d21b7b25b7d4083d9e37c02f" }
            - { name: PGHOST, value: wdmv-test-db }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER, value: moneyverse_migrator }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-db-superuser, key: POSTGRES_PASSWORD }
            - { name: PGDATABASE, value: moneyverse_test }
          envFrom:
            - secretRef:
                name: wdmv-test-app
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
              work=/tmp/moneyverse-source
              rm -rf "$work"
              mkdir -p "$work"
              wget -qO /tmp/moneyverse-source.tgz \
                "https://codeload.github.com/wtrdd1-hash/Woldeok-Moneyverse-Migration/tar.gz/${TEST_SOURCE_SHA}"
              tar -xzf /tmp/moneyverse-source.tgz -C "$work" --strip-components=1
              MIGRATIONS_DIR="$work/packages/database/migrations" sh "$work/packages/database/migrate.sh"
              sh "$work/deploy/seed.sh"
              echo "test database migrated and seeded from ${TEST_SOURCE_SHA}"
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: ghcr.io/wtrdd1-hash/wdmv/backend:cf73d089883f7d98d21b7b25b7d4083d9e37c02f-test
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOST, value: 0.0.0.0 }
            - { name: PHOTO_STORAGE_DIR, value: /data/moneyverse/photos }
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: APP_DB_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: DB_NAME }
            - name: DATABASE_URL
              value: postgresql://moneyverse_app:$(APP_DB_PASSWORD)@wdmv-test-db:5432/$(DB_NAME)
            - name: STATUS_COLLECTOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: STATUS_COLLECTOR_PASSWORD }
            - name: STATUS_COLLECTOR_DATABASE_URL
              value: postgresql://moneyverse_status_collector:$(STATUS_COLLECTOR_PASSWORD)@wdmv-test-db:5432/$(DB_NAME)
            - name: RECONCILER_PASSWORD
              valueFrom:
                secretKeyRef: { name: wdmv-test-app, key: RECONCILER_PASSWORD }
            - name: RECONCILER_DATABASE_URL
              value: postgresql://moneyverse_reconciler:$(RECONCILER_PASSWORD)@wdmv-test-db:5432/$(DB_NAME)
            - { name: MARKET_TICKER_ENABLED, value: "true" }
            - { name: MARKET_TICK_INTERVAL_MS, value: "1000" }
            - { name: STATUS_COLLECT_INTERVAL_MS, value: "30000" }
            - { name: WEB_HEALTH_URL, value: http://wdmv-test-frontend:3000/ }
          envFrom:
            - secretRef:
                name: wdmv-test-app
            - secretRef:
                name: wdmv-test-internal
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: photos, mountPath: /data/moneyverse/photos }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: photos
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
