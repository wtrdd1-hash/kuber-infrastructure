name: Auto Reconcile Woldeok Moneyverse

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wdmv-auto-reconcile
  cancel-in-progress: false

env:
  APP_REPO: wtrdd1-hash/Woldeok-Moneyverse-Migration

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve latest fully built main test candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${APP_REPO}/branches/main" --jq '.commit.sha')"
          test_sha="$(gh api "repos/${APP_REPO}/actions/workflows/test-candidate.yml/runs?branch=main&status=success&per_page=10" \
            --jq '.workflow_runs | map(select(.event == "push")) | .[0].head_sha // empty')"
          if [[ -z "$test_sha" || "$test_sha" != "$main_sha" ]]; then
            echo "latest main candidate is not ready yet: main=$main_sha candidate=${test_sha:-none}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$test_sha" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Promote exact SHA to isolated test manifests
        if: steps.candidate.outputs.ready == 'true'
        shell: python
        env:
          APP_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          import os, pathlib, re
          sha = os.environ['APP_SHA']
          root = pathlib.Path('staging/wdmv-test')
          files = [root/'backend.yaml', root/'frontend.yaml']
          for path in files:
              text = path.read_text()
              component = 'backend' if path.name == 'backend.yaml' else 'frontend'
              text, n = re.subn(rf'ghcr\.io/wtrdd1-hash/wdmv/{component}:[0-9a-f]{{40}}-test', f'ghcr.io/wtrdd1-hash/wdmv/{component}:{sha}-test', text)
              if n != 1: raise SystemExit(f'{path}: image replacement count {n}')
              text, n = re.subn(r'moneyverse\.openai/candidate-sha: "[0-9a-f]{40}"', f'moneyverse.openai/candidate-sha: "{sha}"', text)
              if n != 1: raise SystemExit(f'{path}: candidate label replacement count {n}')
              if component == 'backend':
                  text, n = re.subn(r'TEST_SOURCE_SHA, value: "[0-9a-f]{40}"', f'TEST_SOURCE_SHA, value: "{sha}"', text)
                  if n != 1: raise SystemExit(f'{path}: source SHA replacement count {n}')
              path.write_text(text)
          postgres = root/'postgres.yaml'
          text = postgres.read_text()
          text, n = re.subn(r'TEST_SOURCE_SHA, value: "[0-9a-f]{40}"', f'TEST_SOURCE_SHA, value: "{sha}"', text)
          if n != 1: raise SystemExit(f'{postgres}: source SHA replacement count {n}')
          postgres.write_text(text)

      - name: Commit isolated test promotion
        if: steps.candidate.outputs.ready == 'true'
        shell: bash
        env:
          APP_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- staging/wdmv-test; then
            echo "test manifests already pin $APP_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add staging/wdmv-test
            git commit -m "auto(wdmv): test ${APP_SHA:0:12}"
            git push origin HEAD:main
          fi

      - name: Resolve successful production-ready signal
        if: steps.candidate.outputs.ready == 'true'
        id: production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${APP_REPO}/deployments?environment=production-ready&per_page=20" > /tmp/production-ready.json
          deployment="$(jq -c --arg sha "$TEST_SHA" '[.[] | select(.sha == $sha)][0] // empty' /tmp/production-ready.json)"
          if [[ -z "$deployment" ]]; then
            echo "no production-ready deployment signal for $TEST_SHA"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployment_id="$(jq -r '.id' <<<"$deployment")"
          state="$(gh api "repos/${APP_REPO}/deployments/${deployment_id}/statuses?per_page=1" --jq '.[0].state // empty')"
          if [[ "$state" != success ]]; then
            echo "production-ready signal is not successful: $state"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "sha=$TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Re-verify exact SHA on test before production mutation
        if: steps.production.outputs.ready == 'true'
        shell: bash
        env:
          APP_SHA: ${{ steps.production.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(curl -fsS --max-time 15 https://test.easy-scraping.com/api/version | jq -r '.id')"
          [[ "$version" == "$APP_SHA" ]] || { echo "::error::test serves $version, expected $APP_SHA"; exit 1; }
          curl -fsS --max-time 15 https://test.easy-scraping.com/app-api/shop/public-catalog \
            | jq -e '.catalogItems | type == "array" and length > 0' >/dev/null
          curl -fsSI --max-time 10 https://test.easy-scraping.com/ | grep -Eiq '^x-robots-tag:.*noindex'

      - name: Promote exact SHA to production manifests
        if: steps.production.outputs.ready == 'true'
        shell: python
        env:
          APP_SHA: ${{ steps.production.outputs.sha }}
        run: |
          import os, pathlib, re
          sha = os.environ['APP_SHA']
          for path in [pathlib.Path('apps/wdmvp/backend.yaml'), pathlib.Path('apps/wdmvp/frontend.yaml')]:
              text = path.read_text()
              component = 'backend' if path.name == 'backend.yaml' else 'frontend'
              text, n = re.subn(rf'ghcr\.io/wtrdd1-hash/wdmv/{component}:[0-9a-f]{{40}}-production', f'ghcr.io/wtrdd1-hash/wdmv/{component}:{sha}-production', text)
              if n != 1: raise SystemExit(f'{path}: production image replacement count {n}')
              path.write_text(text)

      - name: Commit production promotion
        if: steps.production.outputs.ready == 'true'
        shell: bash
        env:
          APP_SHA: ${{ steps.production.outputs.sha }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- apps/wdmvp/backend.yaml apps/wdmvp/frontend.yaml; then
            echo "production manifests already pin $APP_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/wdmvp/backend.yaml apps/wdmvp/frontend.yaml
            git commit -m "auto(wdmv): production ${APP_SHA:0:12}"
            git push origin HEAD:main
          fi

      - name: Verify public production smoke for exact SHA
        if: steps.production.outputs.ready == 'true'
        shell: bash
        env:
          APP_SHA: ${{ steps.production.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            version="$(curl -fsS --max-time 10 https://easy-scraping.com/api/version 2>/dev/null | jq -r '.id // empty' || true)"
            if [[ "$version" == "$APP_SHA" ]]; then
              curl -fsS --max-time 15 https://easy-scraping.com/app-api/shop/public-catalog \
                | jq -e '.catalogItems | type == "array" and length > 0' >/dev/null
              curl -fsS --max-time 15 https://easy-scraping.com/status >/dev/null
              echo "production serves exact SHA $APP_SHA with backend/database smoke passing"
              exit 0
            fi
            sleep 10
          done
          echo "::error::production never served exact SHA $APP_SHA"
          exit 1
