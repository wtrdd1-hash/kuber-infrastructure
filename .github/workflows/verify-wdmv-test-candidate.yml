name: Verify WDMV Test Candidate 1832baffb57e

on:
  push:
    branches:
      - verify/wdmv-test-1832baffb57e

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact SHA and public stock-community path
        shell: bash
        env:
          EXPECTED_SHA: 1832baffb57eb7d2ad603346de20769587d94b0a
          TEST_ORIGIN: https://test.easy-scraping.com
        run: |
          set -euo pipefail
          matched=false
          for _ in $(seq 1 48); do
            version="$(curl -fsS --max-time 10 "$TEST_ORIGIN/api/version" 2>/dev/null | jq -r '.id // empty' || true)"
            if [[ "$version" == "$EXPECTED_SHA" ]]; then
              matched=true
              break
            fi
            sleep 5
          done
          [[ "$matched" == true ]] || { echo "::error::test did not serve exact SHA $EXPECTED_SHA"; exit 1; }

          curl -fsS --max-time 15 "$TEST_ORIGIN/api/v1/board/public/stock-posts" \
            | jq -e '.posts | type == "array"' >/dev/null
          curl -fsS --max-time 15 "$TEST_ORIGIN/api/v1/board/public/stock-posts?stock=WDX" \
            | jq -e '.posts | type == "array"' >/dev/null
          curl -fsS --max-time 15 "$TEST_ORIGIN/app-api/shop/public-catalog" \
            | jq -e '.catalogItems | type == "array" and length > 0' >/dev/null
          curl -fsSI --max-time 10 "$TEST_ORIGIN/" | grep -Eiq '^x-robots-tag:.*noindex'
          curl -fsS --max-time 15 "$TEST_ORIGIN/board?stock=WDX" >/tmp/board.html
          grep -q '커뮤니티 광장' /tmp/board.html
          echo "isolated Test serves exact SHA $EXPECTED_SHA and stock-community public smoke passed"
